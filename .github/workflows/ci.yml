name: Build Kernel and Qemu

on:
  push:
    branches:
      - aizel

jobs: 
  build_package:
    name: Build Kernel Package
    runs-on: bare-metal
    permissions:
     contents: 'read'
     id-token: 'write'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive 
      - name: Get and set the current date
        run: |
          TODAY=$(date "+%F")
          echo "TODAY=${TODAY}" >> $GITHUB_ENV
      - name: Build
        run: ./build.sh --package
      - name: Upload to Google Cloud Storage
        run: gcloud storage cp ./snp-release-${{ env.TODAY }} gs://aizel-kernel-artifact/snp-release-${{ env.TODAY }}